name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    services:
      postgres:
        image: postgres:17.3
        env:
          POSTGRES_USER: lct
          POSTGRES_PASSWORD: lct
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U lct -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BUNDLE_GEMFILE: gemfiles/rails_8_1.gemfile
      LCT_TEST_HOST: 127.0.0.1
      LCT_TEST_PORT: 55432
      LCT_TEST_USERNAME: lct
      LCT_TEST_PASSWORD: lct
      LCT_TEST_ADMIN_DATABASE: postgres

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
        bundler-cache: true

    - name: Verify tag matches gem version
      run: |
        version=$(ruby -e 'require_relative "lib/llm_cost_tracker/version"; print LlmCostTracker::VERSION')
        test "v${version}" = "${GITHUB_REF_NAME}"

    - name: Run release checks
      run: bin/check

    - name: Build release notes from changelog
      run: |
        version="${GITHUB_REF_NAME#v}"
        VERSION="$version" RELEASE_NOTES_PATH="release_notes.md" ruby -e '
          version = ENV.fetch("VERSION")
          lines = File.readlines("CHANGELOG.md", chomp: true)
          start = lines.index { |line| line.match?(/^## \[#{Regexp.escape(version)}\] - /) }
          abort "Missing CHANGELOG entry for #{version}" unless start

          rest = lines[(start + 1)..]
          finish = rest.index { |line| line.start_with?("## [") }
          section = lines[(start + 1)...(finish ? start + 1 + finish : lines.length)]
          notes = section.drop_while(&:empty?).join("\n").rstrip

          abort "Empty CHANGELOG entry for #{version}" if notes.empty?

          File.write(ENV.fetch("RELEASE_NOTES_PATH"), notes + "\n")
        '

    - name: Publish gem
      uses: rubygems/release-gem@v1

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
          gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release_notes.md
        else
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --notes-file release_notes.md
        fi
