d on a pay-as-you-go basis. Production API keys are designed for production use at scale.\"}],\"style\":\"normal\"}],\"primaryCta\":{\"_type\":\"object\",\"isExternal\":false},\"secondaryCta\":{\"_type\":\"object\",\"isExternal\":false}},{\"_key\":\"158ca834a392\",\"_type\":\"accordionItem\",\"headline\":\"Are there any account limitations upon signup?\",\"portableBody\":[{\"_key\":\"e5ddde798ada\",\"_type\":\"block\",\"children\":[{\"_key\":\"18417cc37c1d\",\"_type\":\"span\",\"text\":\"Every account begins as a personal account and only has access to Trial API keys. As a personal account, you will not be able to add other members until you become part of an organization.\"}],\"style\":\"normal\"}],\"primaryCta\":{\"_type\":\"object\",\"isExternal\":false},\"secondaryCta\":{\"_type\":\"object\",\"isExternal\":false}},{\"_key\":\"4c2aa5f94a54\",\"_type\":\"accordionItem\",\"headline\":\"What’s the difference between an organization and a personal account?\",\"portableBody\":[{\"_key\":\"e4cf254c5a5c\",\"_type\":\"block\",\"children\":[{\"_key\":\"4c2032d9a943\",\"_type\":\"span\",\"text\":\"At Cohere, an organization is a group of personal accounts that share a singular billing portal. Organizations are not automatically given Production API key access, and a member of the organization must still fill out our application form for production access. Personal accounts cannot share billing information with other accounts.\"}],\"style\":\"normal\"}],\"primaryCta\":{\"_type\":\"object\",\"isExternal\":false},\"secondaryCta\":{\"_type\":\"object\",\"isExternal\":false}},{\"_key\":\"70cc3aff5235\",\"_type\":\"accordionItem\",\"headline\":\"Which model should I pick?\",\"portableBody\":[{\"_key\":\"9d6fc475b6d6\",\"_type\":\"block\",\"children\":[{\"_key\":\"48ddea7bce09\",\"_type\":\"span\",\"text\":\"Your model selection reflects your relative prioritization of model performance and speed. Larger models offer better performance and are capable of more complex tasks, while smaller models have faster response times.\"}],\"style\":\"normal\"}],\"primaryCta\":{\"_type\":\"object\",\"isExternal\":false},\"secondaryCta\":{\"_type\":\"object\",\"isExternal\":false}},{\"_key\":\"5c06811271b4\",\"_type\":\"accordionItem\",\"headline\":\"When do I get billed?\",\"portableBody\":[{\"_key\":\"33322c21f739\",\"_type\":\"block\",\"children\":[{\"_key\":\"97bb4ed2dd37\",\"_type\":\"span\",\"text\":\"API calls made from a Trial API key will be free. API calls made from a Production key will be billed on a pay-as-you-go basis. Your bill will be issued at the end of every calendar month or when you reach $250 in outstanding balances.\"}],\"style\":\"normal\"}],\"primaryCta\":{\"_type\":\"object\",\"isExternal\":false},\"secondaryCta\":{\"_type\":\"object\",\"isExternal\":false}},{\"_key\":\"f604ab222a4e\",\"_type\":\"accordionItem\",\"headline\":\"The endpoint I’m using is billed by token. What is a token?\",\"portableBody\":[{\"_key\":\"95a9fd6d3f6c\",\"_type\":\"block\",\"children\":[{\"_key\":\"1997ca61b30e\",\"_type\":\"span\",\"text\":\"Language models understand “tokens” rather than characters or bytes. The number of tokens per word depends on the complexity of the text. Simple text may approach 1 token per word on average, while complex texts may use less common words that require 3-4 tokens per word on average. For more details on tokens, refer to \"},{\"_key\":\"283415301e26\",\"_type\":\"span\",\"marks\":[\"4d9f15b442f2\"],\"text\":\"this page\"},{\"_key\":\"6bb88f42c58c\",\"_type\":\"span\",\"text\":\".\"}],\"markDefs\":[{\"_key\":\"4d9f15b442f2\",\"_type\":\"link\",\"href\":\"https://docs.cohere.com/docs/tokens-and-tokenizers\"}],\"style\":\"normal\"}],\"primaryCta\":{\"_type\":\"object\",\"isExternal\":false},\"secondaryCta\":{\"_type\":\"object\",\"isExternal\":false}},{\"_key\":\"70577d9da5b1\",\"_type\":\"accordionItem\",\"headline\":\"Where do I find pricing for our legacy models?\",\"portableBody\":[{\"_key\":\"b78309a8fd8f\",\"_type\":\"block\",\"children\":[{\"_key\":\"fa50f68b4925\",\"_type\":\"span\",\"text\":\"For existing customers:\"}],\"style\":\"normal\"},{\"_key\":\"4641fb1b4670\",\"_type\":\"block\",\"children\":[{\"_key\":\"55d0a962c6c8\",\"_type\":\"span\",\"text\":\"\"}],\"style\":\"normal\"},{\"_key\":\"8b05b6c416d0\",\"_type\":\"block\",\"children\":[{\"_key\":\"ecefc674312a\",\"_type\":\"span\",\"text\":\"Command pricing is $1.00/1M tokens for input and $2.00/1M tokens for output\"}],\"level\":1,\"listItem\":\"bullet\",\"style\":\"normal\"},{\"_key\":\"43279f9311e1\",\"_type\":\"block\",\"children\":[{\"_key\":\"a1c63b7e39f7\",\"_type\":\"span\",\"text\":\"Command-light pricing is $0.30/1M tokens for input and $0.60/1M tokens for output\"}],\"level\":1,\"listItem\":\"bullet\",\"style\":\"normal\"},{\"_key\":\"2fc8886b7681\",\"_type\":\"block\",\"children\":[{\"_key\":\"392fa347f0d0\",\"_type\":\"span\",\"text\":\"Command R 03-2024 pricing is $0.50/1M tokens for input and $1.50/1M tokens for output\"}],\"level\":1,\"listItem\":\"bullet\",\"style\":\"normal\"},{\"_key\":\"e46ab9737589\",\"_type\":\"block\",\"children\":[{\"_key\":\"97d2a28c646c\",\"_type\":\"span\",\"text\":\"Command R+ 04-2024 pricing is $3.00/1M tokens for input and $15.00/1M tokens for output\"}],\"level\":1,\"listItem\":\"bullet\",\"style\":\"normal\"},{\"_key\":\"5d7bd857c685\",\"_type\":\"block\",\"children\":[{\"_key\":\"c64b623a4e54\",\"_type\":\"span\",\"text\":\"Command R+ 08-2024 pricing is $2.50/1M tokens for input and $10.00/1M tokens for output\"}],\"style\":\"normal\"}],\"primaryCta\":{\"_type\":\"object\",\"isExternal\":false},\"secondaryCta\":{\"_type\":\"object\",\"isExternal\":false}},{\"_key\":\"e9b49a9d5057\",\"_type\":\"accordionItem\",\"headline\":\"What is the cost for accessing the research Aya models via the API?\",\"portableBody\":[{\"_key\":\"053a84403d79\",\"_type\":\"block\",\"children\":[{\"_key\":\"df134fc9848f\",\"_type\":\"span\",\"text\":\"Aya Expanse models (8B and 32B) on the API are charged at $0.50/1M tokens for input and $1.50/1M tokens for output. Find more information about the Aya models \"},{\"_key\":\"684965a6e217\",\"_type\":\"span\",\"marks\":[\"2ed745e9daed\"],\"text\":\"here\"},{\"_key\":\"cb31e1149cc9\",\"_type\":\"span\",\"text\":\".\"}],\"markDefs\":[{\"_key\":\"2ed745e9daed\",\"_type\":\"link\",\"href\":\"https://cohere.com/research/aya\"}],\"style\":\"normal\"}],\"primaryCta\":{\"_type\":\"object\",\"isExternal\":false},\"secondaryCta\":{\"_type\":\"object\",\"isExternal\":false}},{\"_key\":\"d2135a16b82f\",\"_type\":\"accordionItem\",\"featuredImage\":{\"_type\":\"object\",\"isHighFetchPriority\":false},\"headline\":\"How is a “search” defined for Rerank pricing?\",\"portableBody\":[{\"_key\":\"36a797df41c6\",\"_type\":\"block\",\"children\":[{\"_key\":\"c23ff0903131\",\"_type\":\"span\",\"text\":\"A single search unit is defined as one query with up to 100 documents to be ranked.\"}],\"style\":\"normal\"},{\"_key\":\"26faead72896\",\"_type\":\"block\",\"children\":[{\"_key\":\"4bedb548c213\",\"_type\":\"span\",\"text\":\"\\nIf any document exceeds 500 tokens (including the length of the search query), it is automatically split into multiple chunks. Each chunk is treated as an individual document and counts toward the total number of documents ranked for that search.\"}],\"style\":\"normal\"},{\"_key\":\"a99358486b22\",\"_type\":\"block\",\"children\":[{\"_key\":\"80f10deb44d6\",\"_type\":\"span\",\"text\":\"\\nThis ensures consistent performance and accurate pricing when working with longer documents.\"}],\"style\":\"normal\"}],\"primaryCta\":{\"_type\":\"object\",\"isExternal\":false},\"secondaryCta\":{\"_type\":\"object\",\"isExternal\":false}}],\"accordionPosition\":\"right\",\"staticHeadline\":\"Frequently asked questions\"}],\"anchor\":null,\"anchorName\":\"faq\",\"carousel\":null,\"cta\":null,\"ctas\":null,\"marketoFormReference\":null,\"padding\":{\"_type\":\"object\",\"paddingBottom\":\"sm\",\"paddingSide\":\"
